name: zh-Hans build

# Builds a Simplified-Chinese Hermes for sideloading (LiveContainer / SideStore).
#   stage=export -> exportLocalizations, uploads the zh-Hans .xcloc to translate
#   stage=build  -> imports Localization/zh-Hans.xliff, builds an unsigned iOS IPA, publishes a release
on:
  workflow_dispatch:
    inputs:
      stage:
        description: export | build
        required: true
        default: export

jobs:
  run:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          # Upstream targets Xcode 27; on an older Xcode compile the existing iOS 26 fallbacks only.
          MAJOR=$(xcodebuild -version | awk '/^Xcode/{split($2,v,"."); print v[1]}')
          if [ "$MAJOR" -lt 27 ]; then echo "SDKFLAGS=-DHERMES_SDK26 -Xfrontend -solver-expression-time-threshold=900" >> "$GITHUB_ENV"; else echo "SDKFLAGS=" >> "$GITHUB_ENV"; fi

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Hermes.xcodeproj -scheme Hermes

      - name: Export localizations
        if: inputs.stage == 'export'
        run: |
          set -o pipefail
          mkdir -p out
          xcodebuild -exportLocalizations -project Hermes.xcodeproj \
            -localizationPath out -exportLanguage zh-Hans \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO "OTHER_SWIFT_FLAGS=\$(inherited) $SDKFLAGS" > out/export.log 2>&1 || {
              grep -E "error:" out/export.log | sort -u | head -80; exit 1; }
          find out -maxdepth 3 | head -50

      - uses: actions/upload-artifact@v4
        if: always() && inputs.stage == 'export'
        with:
          name: zh-Hans-xcloc
          path: out

      - name: Import translations
        if: inputs.stage == 'build'
        run: |
          xcodebuild -importLocalizations -project Hermes.xcodeproj \
            -localizationPath Localization/zh-Hans.xliff -mergeImport 2>&1 | tail -30

      - name: Build unsigned IPA
        if: inputs.stage == 'build'
        run: |
          xcodebuild -project Hermes.xcodeproj -scheme Hermes -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" "OTHER_SWIFT_FLAGS=\$(inherited) $SDKFLAGS" build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80; exit 1; }
          APP=$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          ls "$APP" | head -50
          ls -d "$APP"/*.lproj
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Hermes-zh-Hans-unsigned.ipa Payload)
          ls -la Hermes-zh-Hans-unsigned.ipa

      - name: Publish release
        if: inputs.stage == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=zh-hans-$(date -u +%Y%m%d%H%M)
          gh release create "$TAG" Hermes-zh-Hans-unsigned.ipa --repo "$GITHUB_REPOSITORY" \
            --title "Hermes 简体中文版 $TAG" --notes "Unsigned IPA with zh-Hans localization, for LiveContainer / SideStore."
