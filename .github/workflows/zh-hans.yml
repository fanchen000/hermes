name: zh-Hans build

# Builds a Simplified-Chinese Hermes for sideloading (LiveContainer / SideStore).
# Every run builds the iOS app unsigned, uploads the compiler-extracted strings (.stringsdata)
# so the zh-Hans catalog can be (re)translated, and publishes the IPA as a release when
# publish=yes. The translations live in App/Resources/Localizable.xcstrings.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: publish a release (yes/no)
        required: true
        default: "no"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
          # Upstream targets Xcode 27; on an older Xcode compile the existing iOS 26 fallbacks only.
          MAJOR=$(xcodebuild -version | awk '/^Xcode/{split($2,v,"."); print v[1]}')
          if [ "$MAJOR" -lt 27 ]; then
            echo "SDKFLAGS=-DHERMES_SDK26 -Xfrontend -solver-expression-time-threshold=900" >> "$GITHUB_ENV"
          else
            echo "SDKFLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild -project Hermes.xcodeproj -scheme Hermes -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            SWIFT_EMIT_LOC_STRINGS=YES "OTHER_SWIFT_FLAGS=\$(inherited) $SDKFLAGS" \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u | head -80; exit 1; }
          grep -c "warning:" build.log || true

      - name: Collect extracted strings
        if: always()
        run: |
          mkdir -p strings
          if [ -d dd/Build/Intermediates.noindex ]; then
            find dd/Build/Intermediates.noindex -name '*.stringsdata' -print0 | while IFS= read -r -d '' file; do
              # Keep distinct files even when separate modules use the same basename.
              id=$(printf '%s' "$file" | shasum -a 256 | cut -c 1-20)
              cp "$file" "strings/${id}.stringsdata"
            done
          fi
          echo "Extracted files: $(find strings -name '*.stringsdata' | wc -l)"
          tar -czf stringsdata.tgz strings

      - name: Enforce complete Simplified Chinese catalog
        run: |
          python3 Tools/zh_hans/audit_catalog.py strings --require-full

      - name: Package IPA
        run: |
          APP=$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP" && test -d "$APP"
          ls -d "$APP"/*.lproj || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleLocalizations" "$APP/Info.plist" || true
          test -f "$APP/zh-Hans.lproj/Localizable.strings" || { echo "::error::Missing compiled Simplified Chinese localization"; exit 1; }
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Hermes-zh-Hans-unsigned.ipa Payload)
          ls -la Hermes-zh-Hans-unsigned.ipa

      - name: Verify compiled IPA matches every catalog translation
        run: |
          python3 Tools/zh_hans/verify_ipa.py Hermes-zh-Hans-unsigned.ipa --verify-catalog

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-zh-build
          path: |
            stringsdata.tgz
            Hermes-zh-Hans-unsigned.ipa
            build.log

      - name: Publish release
        if: inputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=zh-hans-preview-$(date -u +%Y%m%d%H%M)
          gh release create "$TAG" Hermes-zh-Hans-unsigned.ipa --prerelease --repo "$GITHUB_REPOSITORY" \
            --title "Hermes 简体中文预览版 $TAG" \
            --notes "Unsigned IPA for LiveContainer / SideStore. All compiler-extracted Localizable strings have Simplified Chinese or explicitly reviewed unchanged technical content, enforced by CI. Real-device UI and side-load signing still require validation before a final release."
